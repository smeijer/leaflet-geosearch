version: 2
updates:
  # the actions are pinned to a commit. Dependabot bumps the commit and the
  # version comment next to it, all in one pull request a month
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # npm packages of the library and the docs site, one pull request a month
  - package-ecosystem: npm
    directories: ['/', '/website']
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # the leaflet dev dependency is Leaflet 1, Leaflet 2 is leaflet-2
      - dependency-name: leaflet
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope

  # the older e2e test runners, each one pinned to the browsers of its
  # Playwright image. Nothing there is updated, not even by a security update
  - package-ecosystem: npm
    directory: /e2e/runners
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
