name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      # Match SemVer major release branches, e.g. "2.x" or ".x"
      - '[0-9]+.x'
      - 'main'
      - 'next'
      - 'alpha'
      - 'beta'
      - 'develop'
      - '!all-contributors/**'

env:
  NODE_VERSION: "24.x"

permissions:
  id-token: write # Required for OIDC
  contents: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        id: cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  eslint:
    name: Eslint
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Fetch all branches
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: ESLint
        run: npm run ci:lint -- $(git diff --diff-filter d --name-only origin/${{ github.base_ref }}...HEAD -- '*.js' '*.ts' '*.tsx')

  typescript:
    name: Typescript
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Typescript
        run: npm run ci:tsc

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 5
    strategy:
      matrix:
        leaflet: ["1.6.0", "1.7.1", "1.8.0", "1.9.0"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: install specific leaflet version
        run: npm install leaflet@${{ matrix.leaflet }}

      - name: unit tests
        run: npm run ci:test
        env:
          GATSBY_BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GATSBY_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GATSBY_LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
          GATSBY_OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}
          GATSBY_HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          GATSBY_AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build the package and the docs
        run: npm run docs:build
        env:
          # the demos need the keys only on the published site
          AMAP_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.AMAP_API_KEY || '' }}
          BING_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.BING_API_KEY || '' }}
          GOOGLE_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.GOOGLE_API_KEY || '' }}
          HERE_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.HERE_API_KEY || '' }}
          LOCATIONIQ_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.LOCATIONIQ_API_KEY || '' }}
          OPENCAGE_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.OPENCAGE_API_KEY || '' }}

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: docs
          path: website/doc_build
          include-hidden-files: true
          retention-days: 1

  deploy-docs:
    name: Deploy docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'smeijer/leaflet-geosearch'
    runs-on: ubuntu-latest
    needs: [docs, tests, typescript]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: ${{ runner.temp }}/docs

      # GitHub Pages serves the gh-pages branch. Its content is replaced
      # with the new build in one commit
      - name: Push to gh-pages
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git fetch --depth=1 origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/gh-pages" origin/gh-pages
          cd "$RUNNER_TEMP/gh-pages"
          git rm -rq --ignore-unmatch .
          cp -r "$RUNNER_TEMP/docs/." .
          touch .nojekyll
          git add -A
          git diff --staged --quiet || git commit -m "update docs"
          git push origin HEAD:gh-pages

  release:
    needs: [tests, typescript]
    if: github.event_name == 'push' && github.repository == 'smeijer/leaflet-geosearch'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.0

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 25
          branches: |
            [
              '+([0-9])?(.{+([0-9]),x}).x',
              'main',
              'next',
              'develop',
              { name: 'alpha', prerelease: true },
              { name: 'beta', prerelease: true }
            ]
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
