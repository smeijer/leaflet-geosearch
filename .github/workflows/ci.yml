name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      # Match SemVer major release branches, e.g. "2.x" or ".x"
      - '[0-9]+.x'
      - 'main'
      - 'next'
      - 'alpha'
      - 'beta'
      - 'develop'
      - '!all-contributors/**'

env:
  NODE_VERSION: "24.x"

# a new push to a pull request replaces its running checks. Runs on main and
# the release branches always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write # Required for OIDC
  contents: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        id: cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  eslint:
    name: Eslint
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: ESLint
        run: npm run ci:lint

  typescript:
    name: Typescript
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Typescript
        run: npm run ci:tsc

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 5
    # Leaflet 2 is an alpha: its run reports problems without failing the workflow
    continue-on-error: ${{ startsWith(matrix.leaflet, '2.') }}
    strategy:
      fail-fast: false
      matrix:
        leaflet: ["1.6.0", "1.7.1", "1.8.0", "1.9.0", "1.9.4", "2.0.0-alpha.1"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: install specific leaflet version
        run: npm install leaflet@${{ matrix.leaflet }}

      # the run with the latest Leaflet also measures coverage
      - name: unit tests
        run: npm run ci:test -- ${{ matrix.leaflet == '1.9.4' && '--coverage --coverage.reporter=json-summary --coverage.reporter=text-summary' || '' }}
        env:
          GATSBY_BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GATSBY_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GATSBY_LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
          GATSBY_OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}
          GATSBY_HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          GATSBY_AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}

      - name: coverage summary
        if: matrix.leaflet == '1.9.4'
        run: node scripts/coverage-summary.mjs

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Bundle size
        run: node scripts/size-report.mjs

      # publint and arethetypeswrong on the packed package
      - name: Check the package
        run: npm run ci:package

      # installs the packed package in an empty TypeScript project
      - name: Type check the package
        run: npm run ci:package-types

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # the built bundles in a real browser, provider requests are mocked
      - name: End-to-end tests
        run: npm run test:e2e

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build the package and the docs
        run: npm run docs:build
        env:
          # the demos need the keys only on the published site
          AMAP_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.AMAP_API_KEY || '' }}
          BING_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.BING_API_KEY || '' }}
          GEOAPIFY_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.GEOAPIFY_API_KEY || '' }}
          GEOCODEEARTH_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.GEOCODEEARTH_API_KEY || '' }}
          GOOGLE_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.GOOGLE_API_KEY || '' }}
          HERE_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.HERE_API_KEY || '' }}
          LOCATIONIQ_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.LOCATIONIQ_API_KEY || '' }}
          MAPBOX_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.MAPBOX_API_KEY || '' }}
          OPENCAGE_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.OPENCAGE_API_KEY || '' }}

      # needs the declarations in dist from the build
      - name: Type check the docs components
        run: npm run docs:typecheck

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: docs
          path: website/doc_build
          include-hidden-files: true
          retention-days: 1

  deploy-docs:
    name: Deploy docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'smeijer/leaflet-geosearch'
    runs-on: ubuntu-latest
    needs: [docs, tests, typescript]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: docs
          path: ${{ runner.temp }}/docs

      # GitHub Pages serves the gh-pages branch. Its content is replaced
      # with the new build in one commit
      - name: Push to gh-pages
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git fetch --depth=1 origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/gh-pages" origin/gh-pages
          cd "$RUNNER_TEMP/gh-pages"
          git rm -rq --ignore-unmatch .
          cp -r "$RUNNER_TEMP/docs/." .
          touch .nojekyll
          git add -A
          git diff --staged --quiet || git commit -m "update docs"
          git push origin HEAD:gh-pages

  release:
    # publish only when every check passed
    needs: [eslint, typescript, tests, package, e2e, docs]
    if: github.event_name == 'push' && github.repository == 'smeijer/leaflet-geosearch'
    runs-on: ubuntu-latest
    environment: npm
    # the workflow token instead of a personal one, so nothing expires. The
    # github plugin comments on the released issues and pull requests
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Release
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 25
          branches: |
            [
              '+([0-9])?(.{+([0-9]),x}).x',
              'main',
              'next',
              'develop',
              { name: 'alpha', prerelease: true },
              { name: 'beta', prerelease: true }
            ]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
