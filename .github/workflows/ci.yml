name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      # Match SemVer major release branches, e.g. "2.x" or ".x"
      - '[0-9]+.x'
      - 'main'
      - 'next'
      - 'alpha'
      - 'beta'
      - 'develop'
      - '!all-contributors/**'

env:
  NODE_VERSION: "24.x"
  # the Leaflet versions of the e2e tests, the same as in the unit tests. leaflet
  # (1.9.4) and leaflet-2 are the dev dependencies, the others come from
  # scripts/e2e-leaflet.mjs
  E2E_LEAFLET: "1.6.0 1.7.1 1.8.0 1.9.0 leaflet 2.0.0-alpha.1 leaflet-2 main"

# a new push to a pull request replaces its running checks. Runs on main and
# the release branches always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# read-only by default. Only deploy-docs and release get write access
permissions:
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"

      # the e2e job runs in the Playwright image of this version, with the test
      # runner from e2e/runners/latest. Both have to be the same version
      - name: Playwright version
        id: playwright
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          runner=$(node -p "require('./e2e/runners/latest/package-lock.json').packages['node_modules/@playwright/test'].version")
          if [ "$version" != "$runner" ]; then
            echo "::error file=e2e/runners/latest/package.json::@playwright/test is $version in package-lock.json and $runner in e2e/runners/latest"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache node modules
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  eslint:
    name: Eslint
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: ESLint
        run: npm run ci:lint

  typescript:
    name: Typescript
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Typescript
        run: npm run ci:tsc

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 5
    # Leaflet 2 is still in alpha and beta and its main branch is unreleased:
    # their runs report problems without failing the workflow
    continue-on-error: ${{ startsWith(matrix.leaflet, '2.') || matrix.leaflet == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        leaflet: ["1.6.0", "1.7.1", "1.8.0", "1.9.0", "1.9.4", "2.0.0-alpha.1", "2.0.0-beta.4", "main"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: install specific leaflet version
        run: npm install ${{ matrix.leaflet == 'main' && 'https://codeload.github.com/Leaflet/Leaflet/tar.gz/main' || format('leaflet@{0}', matrix.leaflet) }}

      # the run with the latest Leaflet also measures coverage
      - name: unit tests
        run: npm run ci:test -- ${{ matrix.leaflet == '1.9.4' && '--coverage --coverage.reporter=json-summary --coverage.reporter=text-summary' || '' }}
        env:
          GATSBY_BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GATSBY_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GATSBY_LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
          GATSBY_OPENCAGE_API_KEY: ${{ secrets.OPENCAGE_API_KEY }}
          GATSBY_HERE_API_KEY: ${{ secrets.HERE_API_KEY }}
          GATSBY_AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}

      - name: coverage summary
        if: matrix.leaflet == '1.9.4'
        run: node scripts/coverage-summary.mjs

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Bundle size
        run: node scripts/size-report.mjs

      # publint and arethetypeswrong on the packed package
      - name: Check the package
        run: npm run ci:package

      # installs the packed package in an empty TypeScript project
      - name: Type check the package
        run: npm run ci:package-types

  # what every e2e job needs, built and fetched once: the bundles and the
  # Leaflet versions (scripts/e2e-leaflet.mjs)
  e2e-files:
    name: E2E files
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Leaflet versions
        run: node scripts/e2e-leaflet.mjs ${{ env.E2E_LEAFLET }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-files
          path: |
            dist
            e2e/vendor
            node_modules/leaflet/dist
            node_modules/leaflet-2/dist
          retention-days: 1

  # the built bundles in Chromium, Firefox and WebKit, each with every Leaflet
  # version of E2E_LEAFLET (a Playwright project per browser and version).
  # Every Playwright version ships its own browser builds, so the older
  # versions test older browsers that people still use. The Playwright image
  # has the browsers and their system libraries: nothing is downloaded or
  # installed with apt, and the job only installs the test runner
  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [setup, e2e-files]
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright || needs.setup.outputs.playwright }}-${{ matrix.image || 'noble' }}
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        # versions where support ends for an OS or a device, the ESR releases
        # and Chrome 130 (GitbookIO/gitbook#4786)
        include:
          # the Playwright version from the lockfile
          - name: latest browsers
          # Firefox 140 is the current ESR
          - name: Chrome 139, Firefox 140 ESR, Safari 26.0
            playwright: 1.54.2
          - name: Chrome 130, Firefox 131, Safari 18.0
            playwright: 1.48.2
          # Chrome 128 is the last one on macOS 10.15
          - name: Chrome 128, Firefox 128 ESR, Safari 18.0
            playwright: 1.46.1
          # Chrome 116 is the last one on macOS 10.13 and 10.14. Firefox 115
          # ESR is the last one on Windows 7, 8.1 and macOS 10.12 to 10.14
          - name: Chrome 116, Firefox 115 ESR, Safari 17.0
            playwright: 1.37.1
            image: jammy
          # Chrome 109 is the last one on Windows 7 and 8.1, Safari 16 the last
          # one on the iPhone 8 and X
          - name: Chrome 109, Firefox 107, Safari 16.4
            playwright: 1.29.2
            image: jammy
          # Safari 15 is the last one on the iPhone 6s and 7
          - name: Chrome 102, Firefox 99, Safari 15.4
            playwright: 1.22.2
            image: focal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-files

      # only the test runner, matching the browsers in the image, from its
      # lockfile in e2e/runners. The tests need nothing else from node_modules
      - name: Install Playwright ${{ matrix.playwright || needs.setup.outputs.playwright }}
        env:
          RUNNER: e2e/runners/${{ matrix.playwright || 'latest' }}
        run: |
          npm ci --prefix "$RUNNER" --no-audit --no-fund
          mkdir -p node_modules
          cp -R "$RUNNER/node_modules/." node_modules/

      # provider requests are mocked
      - name: End-to-end tests
        env:
          LEAFLET_VERSIONS: ${{ env.E2E_LEAFLET }}
        run: npx playwright test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Install website dependencies
        run: npm ci --prefix website

      - name: Build the package and the docs
        run: npm run docs:build
        env:
          # the demos need the keys only on the published site
          AMAP_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.AMAP_API_KEY || '' }}
          BING_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.BING_API_KEY || '' }}
          GEOAPIFY_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.GEOAPIFY_API_KEY || '' }}
          GEOCODEEARTH_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.GEOCODEEARTH_API_KEY || '' }}
          GOOGLE_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.GOOGLE_API_KEY || '' }}
          HERE_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.HERE_API_KEY || '' }}
          LOCATIONIQ_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.LOCATIONIQ_API_KEY || '' }}
          MAPBOX_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.MAPBOX_API_KEY || '' }}
          OPENCAGE_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.OPENCAGE_API_KEY || '' }}
          OPENGEOCODING_API_KEY: ${{ github.ref == 'refs/heads/main' && secrets.OPENGEOCODING_API_KEY || '' }}

      # needs the declarations in dist from the build
      - name: Type check the docs components
        run: npm run docs:typecheck

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: docs
          path: website/doc_build
          include-hidden-files: true
          retention-days: 1

  deploy-docs:
    name: Deploy docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'smeijer/leaflet-geosearch'
    runs-on: ubuntu-latest
    needs: [docs, tests, typescript]
    timeout-minutes: 5
    permissions:
      contents: write # pushes to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: ${{ runner.temp }}/docs

      # GitHub Pages serves the gh-pages branch. Its content is replaced
      # with the new build in one commit
      - name: Push to gh-pages
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"
          git fetch --depth=1 origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/gh-pages" origin/gh-pages
          cd "$RUNNER_TEMP/gh-pages"
          git rm -rq --ignore-unmatch .
          cp -r "$RUNNER_TEMP/docs/." .
          touch .nojekyll
          git add -A
          git diff --staged --quiet || git commit -m "update docs"
          git push origin HEAD:gh-pages

  release:
    # publish only when every check passed
    needs: [eslint, typescript, tests, package, e2e, docs]
    if: github.event_name == 'push' && github.repository == 'smeijer/leaflet-geosearch'
    runs-on: ubuntu-latest
    environment: npm
    # the workflow token instead of a personal one, so nothing expires. The
    # github plugin comments on the released issues and pull requests
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Cache node modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: 25
          branches: |
            [
              '+([0-9])?(.{+([0-9]),x}).x',
              'main',
              'next',
              'develop',
              { name: 'alpha', prerelease: true },
              { name: 'beta', prerelease: true }
            ]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # jsDelivr caches version ranges like @5 and @latest for up to a week.
      # Purging the files the docs link to makes the new version show up
      # right away. Skipped for prereleases, and a failed purge doesn't fail
      # the release
      - name: Purge the jsDelivr cache
        if: steps.release.outputs.new_release_published == 'true' && steps.release.outputs.new_release_channel == ''
        continue-on-error: true
        env:
          MAJOR: ${{ steps.release.outputs.new_release_major_version }}
        run: |
          for version in "@$MAJOR" "@latest" ""; do
            for file in "" /dist/bundle.min.js /dist/geosearch.umd.js /dist/geosearch.module.js /dist/geosearch.css; do
              curl -fsS --retry 2 -o /dev/null "https://purge.jsdelivr.net/npm/leaflet-geosearch$version$file"
            done
          done
