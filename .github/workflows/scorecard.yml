name: Scorecard

# OpenSSF Scorecard checks the repository's security practices and publishes
# the result, which the README badge reads
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  # runs when branch protection changes
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: github.repository == 'smeijer/leaflet-geosearch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # uploads the results to the Security tab
      id-token: write # publishes the results
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
