<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>leaflet-geosearch e2e (ESM, no import map)</title>
    <script src="/e2e/fixtures/leaflet.js"></script>
    <link rel="stylesheet" href="/dist/geosearch.css" />
    <style>
      #map {
        width: 600px;
        height: 400px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <!--
      No import map, for browsers without them (Firefox before 108, Safari
      before 16.4). With ?leaflet=<version> the server points the bare
      "leaflet" import of the bundle at the ESM build of that version, like a
      CDN or a bundler would. See e2e/server.mjs
    -->
    <script type="module">
      const Leaflet = await import(window.e2eLeaflet.esm);
      const GeoSearch = await import(
        '/dist/geosearch.module.js?leaflet=' + window.e2eLeaflet.version
      );

      window.events = [];
      window.GeoSearch = GeoSearch;
      window.map = new Leaflet.Map('map').setView([52, 5], 8);
      window.map.on('geosearch/showlocation', (e) =>
        window.events.push({
          type: 'geosearch/showlocation',
          label: e.location.label,
        }),
      );
      window.ready = true;
    </script>
  </body>
</html>
