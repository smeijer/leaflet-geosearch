<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>leaflet-geosearch e2e (ESM)</title>
    <link rel="stylesheet" href="/node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="/dist/geosearch.css" />
    <style>
      #map {
        width: 600px;
        height: 400px;
      }
    </style>
    <!-- the ESM bundle imports "leaflet" -->
    <script type="importmap">
      {
        "imports": {
          "leaflet": "/node_modules/leaflet/dist/leaflet-src.esm.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="map"></div>

    <script type="module">
      import * as Leaflet from 'leaflet';
      import * as GeoSearch from '/dist/geosearch.module.js';

      window.events = [];
      window.GeoSearch = GeoSearch;
      window.map = new Leaflet.Map('map').setView([52, 5], 8);
      window.map.on('geosearch/showlocation', (e) =>
        window.events.push({
          type: 'geosearch/showlocation',
          label: e.location.label,
        }),
      );
      window.ready = true;
    </script>
  </body>
</html>
